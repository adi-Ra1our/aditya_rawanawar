<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 750' width='100%' height='100%'>
  <rect width='1200' height='750' fill='#13151F'/>
  <defs>
    <pattern id='grid4' width='40' height='40' patternUnits='userSpaceOnUse'>
      <path d='M 40 0 L 0 0 0 40' fill='none' stroke='#202434' stroke-width='1'/>
    </pattern>
  </defs>
  <rect width='1200' height='750' fill='url(#grid4)'/>

  <!-- Top Window Header -->
  <rect x='40' y='40' width='1120' height='50' rx='10' ry='10' fill='#1C2030' stroke='#2F3652' stroke-width='2'/>
  <circle cx='70' cy='65' r='7' fill='#FF5F56'/>
  <circle cx='95' cy='65' r='7' fill='#FFBD2E'/>
  <circle cx='120' cy='65' r='7' fill='#27C93F'/>
  <text x='150' y='71' font-family='monospace' font-size='14' fill='#A9B1D6'>FastAPI Academic Records Engine &amp; SQL Schema Architecture (v2.4)</text>
  <rect x='1030' y='53' width='100' height='24' rx='12' fill='#27C93F' fill-opacity='0.2'/>
  <text x='1045' y='69' font-family='monospace' font-size='12' font-weight='bold' fill='#27C93F'>ACID 100%</text>

  <!-- Left: OpenAPI / Swagger Endpoints -->
  <rect x='40' y='110' width='480' height='590' rx='12' fill='#181B28' stroke='#2F3652' stroke-width='2'/>
  <text x='65' y='145' font-family='sans-serif' font-size='17' font-weight='bold' fill='#FACC00'>RESTFUL API ENDPOINTS (FASTAPI)</text>
  
  <!-- Endpoint 1 GET -->
  <rect x='65' y='170' width='430' height='55' rx='8' fill='#1F2538' stroke='#27C93F' stroke-width='1.5'/>
  <rect x='75' y='182' width='55' height='30' rx='6' fill='#27C93F'/>
  <text x='87' y='202' font-family='monospace' font-size='12' font-weight='bold' fill='#161616'>GET</text>
  <text x='145' y='202' font-family='monospace' font-size='13' fill='#FFFFFF'>/api/v1/students/{id}/transcript</text>

  <!-- Endpoint 2 POST -->
  <rect x='65' y='240' width='430' height='55' rx='8' fill='#1F2538' stroke='#7AA2F7' stroke-width='1.5'/>
  <rect x='75' y='252' width='55' height='30' rx='6' fill='#7AA2F7'/>
  <text x='83' y='272' font-family='monospace' font-size='12' font-weight='bold' fill='#161616'>POST</text>
  <text x='145' y='272' font-family='monospace' font-size='13' fill='#FFFFFF'>/api/v1/marks/batch-upload</text>

  <!-- Endpoint 3 PUT -->
  <rect x='65' y='310' width='430' height='55' rx='8' fill='#1F2538' stroke='#E0AF68' stroke-width='1.5'/>
  <rect x='75' y='322' width='55' height='30' rx='6' fill='#E0AF68'/>
  <text x='87' y='342' font-family='monospace' font-size='12' font-weight='bold' fill='#161616'>PUT</text>
  <text x='145' y='342' font-family='monospace' font-size='13' fill='#FFFFFF'>/api/v1/courses/{code}/re-eval</text>

  <!-- Schema Validation Section -->
  <rect x='65' y='385' width='430' height='290' rx='8' fill='#141622' stroke='#2F3652' stroke-width='1.5'/>
  <text x='85' y='415' font-family='monospace' font-size='12' font-weight='bold' fill='#7AA2F7'>PYDANTIC STRICT VALIDATION SCHEMA</text>
  <text x='85' y='445' font-family='monospace' font-size='11' fill='#BB9AF7'>class StudentRecordSchema(BaseModel):</text>
  <text x='105' y='470' font-family='monospace' font-size='11' fill='#C0CAF5'>student_usn: constr(regex=r'^[1-4][A-Z]{2}\d{2}')</text>
  <text x='105' y='495' font-family='monospace' font-size='11' fill='#C0CAF5'>semester: conint(ge=1, le=8)</text>
  <text x='105' y='520' font-family='monospace' font-size='11' fill='#C0CAF5'>sgpa: confloat(ge=0.0, le=10.0)</text>
  <text x='105' y='545' font-family='monospace' font-size='11' fill='#C0CAF5'>marks_mapping: Dict[str, CourseEvaluation]</text>
  <text x='85' y='580' font-family='monospace' font-size='11' fill='#9ECE6A'># Automated query optimization active</text>
  <text x='85' y='605' font-family='monospace' font-size='11' fill='#9ECE6A'># Indexed queries executed in &lt; 2.4 ms</text>
  <text x='85' y='630' font-family='monospace' font-size='11' fill='#7AA2F7'># Foreign key cascade &amp; ACID transactions</text>

  <!-- Right: Relational Database Schema ERD -->
  <rect x='540' y='110' width='620' height='590' rx='12' fill='#181B28' stroke='#2F3652' stroke-width='2'/>
  <text x='565' y='145' font-family='sans-serif' font-size='17' font-weight='bold' fill='#FACC00'>RELATIONAL SCHEMA ARCHITECTURE (SQL)</text>

  <!-- Table 1: students -->
  <rect x='565' y='175' width='260' height='210' rx='8' fill='#1F2538' stroke='#7AA2F7' stroke-width='1.5'/>
  <rect x='565' y='175' width='260' height='32' rx='8' fill='#242C44'/>
  <text x='580' y='197' font-family='monospace' font-size='13' font-weight='bold' fill='#FFFFFF'>TABLE: students</text>
  <text x='580' y='230' font-family='monospace' font-size='12' fill='#FACC00'>PK  id (UUID)</text>
  <text x='580' y='255' font-family='monospace' font-size='12' fill='#C0CAF5'>    usn VARCHAR(10) UNIQUE</text>
  <text x='580' y='280' font-family='monospace' font-size='12' fill='#C0CAF5'>    name VARCHAR(120)</text>
  <text x='580' y='305' font-family='monospace' font-size='12' fill='#C0CAF5'>    department_id FK</text>
  <text x='580' y='330' font-family='monospace' font-size='12' fill='#C0CAF5'>    current_sem INT</text>
  <text x='580' y='355' font-family='monospace' font-size='12' fill='#27C93F'>    cumulative_gpa NUMERIC</text>

  <!-- Table 2: marks_records -->
  <rect x='875' y='175' width='260' height='210' rx='8' fill='#1F2538' stroke='#FACC00' stroke-width='1.5'/>
  <rect x='875' y='175' width='260' height='32' rx='8' fill='#332F24'/>
  <text x='890' y='197' font-family='monospace' font-size='13' font-weight='bold' fill='#FFFFFF'>TABLE: marks_records</text>
  <text x='890' y='230' font-family='monospace' font-size='12' fill='#FACC00'>PK  record_id (BIGSERIAL)</text>
  <text x='890' y='255' font-family='monospace' font-size='12' fill='#7AA2F7'>FK  student_id (UUID)</text>
  <text x='890' y='280' font-family='monospace' font-size='12' fill='#7AA2F7'>FK  course_id (VARCHAR)</text>
  <text x='890' y='305' font-family='monospace' font-size='12' fill='#C0CAF5'>    internal_marks INT</text>
  <text x='890' y='330' font-family='monospace' font-size='12' fill='#C0CAF5'>    external_marks INT</text>
  <text x='890' y='355' font-family='monospace' font-size='12' fill='#27C93F'>    grade_letter CHAR(2)</text>

  <!-- Relationship Connector Line -->
  <line x1='825' y1='255' x2='875' y2='255' stroke='#FACC00' stroke-width='2' stroke-dasharray='4'/>

  <!-- Query Optimization & Benchmark -->
  <rect x='565' y='410' width='570' height='265' rx='8' fill='#141622' stroke='#2F3652' stroke-width='1.5'/>
  <text x='585' y='440' font-family='monospace' font-size='12' font-weight='bold' fill='#7AA2F7'>AUTOMATED PERFORMANCE &amp; STRESS BENCHMARKS</text>
  <text x='585' y='475' font-family='monospace' font-size='12' fill='#C0CAF5'>• 10,000 Concurrent Batch Grade Inserts: 1.12 seconds (Bulk SQL)</text>
  <text x='585' y='505' font-family='monospace' font-size='12' fill='#C0CAF5'>• Indexing strategy: B-Tree on (student_id, course_id, semester)</text>
  <text x='585' y='535' font-family='monospace' font-size='12' fill='#C0CAF5'>• Pytest Suite: 28 Unit Tests + 12 End-to-End API Integration Tests</text>
  <text x='585' y='565' font-family='monospace' font-size='12' fill='#27C93F'>• 100% Test Pass Rate with Mock Relational Fixtures</text>
  <text x='585' y='600' font-family='monospace' font-size='11' fill='#A9B1D6'>Designed for high data integrity, strict auditability, and zero drift.</text>
</svg>