  <circle cx='830' cy='220' r='8' fill='#FF5F56'/>
  <circle cx='830' cy='220' r='16' fill='#FF5F56' fill-opacity='0.3'/>
  <rect x='760' y='150' width='140' height='45' rx='6' fill='#FF5F56' stroke='#FFFFFF' stroke-width='1'/>
  <text x='775' y='170' font-family='monospace' font-size='11' font-weight='bold' fill='#FFFFFF'>SPIKE DETECTED</text>
  <text x='775' y='185' font-family='monospace' font-size='10' fill='#FFFFFF'>Score: 0.941 | Mitigated</text>

  <!-- Bottom Log Terminal -->
  <rect x='380' y='490' width='780' height='210' rx='12' fill='#15161E' stroke='#333752' stroke-width='2'/>
  <text x='410' y='525' font-family='monospace' font-size='13' font-weight='bold' fill='#FACC00'>AIOPS TELEMETRY EVENT LOGS (VECTORIZED TF-IDF)</text>
  <text x='410' y='555' font-family='monospace' font-size='12' fill='#73DACA'>[21:42:01] INFO  [fastapi.middleware] Telemetry heartbeat stream ack from ESP32 node-04</text>
  <text x='410' y='580' font-family='monospace' font-size='12' fill='#73DACA'>[21:42:02] INFO  [vectorizer.tfidf] Ingested batch 128: vocab dim 2048, norm l2</text>
  <text x='410' y='605' font-family='monospace' font-size='12' fill='#BB9AF7'>[21:42:03] EVAL  [isolation_forest] Estimators: 150 | Max samples: 256 | Anomaly label: -1</text>
  <text x='410' y='630' font-family='monospace' font-size='12' fill='#E0AF68'>[21:42:04] WARN  [ollama.mistral] Root cause correlation: Transient network buffer saturation</text>
  <text x='410' y='655' font-family='monospace' font-size='12' fill='#9ECE6A'>[21:42:05] OK    [fusion_engine] System stabilized. Status 200 OK. Zero packet loss.</text>
