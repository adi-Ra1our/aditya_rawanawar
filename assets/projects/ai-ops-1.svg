  <rect x='1040' y='53' width='90' height='24' rx='12' fill='#27C93F' fill-opacity='0.2'/>
  <text x='1055' y='69' font-family='monospace' font-size='12' font-weight='bold' fill='#27C93F'>● LIVE</text>

