  <text x='85' y='275' font-family='sans-serif' font-size='34' font-weight='bold' fill='#FF5F56'>0.042 <tspan font-size='16' fill='#27C93F'>[STABLE]</tspan></text>

  <!-- Telemetry Parameters -->
  <rect x='65' y='320' width='270' height='210' rx='8' fill='#24283B' stroke='#414868' stroke-width='1.5'/>
