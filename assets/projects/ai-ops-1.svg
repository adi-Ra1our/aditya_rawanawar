  <text x='85' y='620' font-family='sans-serif' font-size='11' fill='#C0CAF5'>Metric variance within 1.2-sigma bound.</text>
  <text x='85' y='640' font-family='sans-serif' font-size='11' fill='#C0CAF5'>System operating in optimal corridor.</text>

  <!-- Main Chart Panel -->
  <rect x='380' y='110' width='780' height='360' rx='12' fill='#1A1B26' stroke='#333752' stroke-width='2'/>
  <text x='410' y='150' font-family='sans-serif' font-size='18' font-weight='bold' fill='#C0CAF5'>Live Infrastructure Stream &amp; Anomaly Detection Thresholds</text>
  
  <!-- Wave Graph -->
  <polyline fill='none' stroke='#333752' stroke-width='1' stroke-dasharray='4' points='410,240 1120,240'/>
  <text x='1060' y='235' font-family='monospace' font-size='11' fill='#FF5F56'>Threshold</text>
  
  <path d='M 410,340 Q 480,260 550,330 T 690,300 T 830,220 T 970,310 T 1120,290' fill='none' stroke='#7AA2F7' stroke-width='3.5'/>
  <path d='M 410,340 Q 480,260 550,330 T 690,300 T 830,220 T 970,310 T 1120,290 L 1120,430 L 410,430 Z' fill='#7AA2F7' fill-opacity='0.08'/>

