  <rect x='65' y='550' width='270' height='125' rx='8' fill='#202438' stroke='#FACC00' stroke-width='1.5'/>
  <text x='85' y='575' font-family='sans-serif' font-size='12' font-weight='bold' fill='#FACC00'>OLLAMA INCIDENT EXPLANATION</text>
