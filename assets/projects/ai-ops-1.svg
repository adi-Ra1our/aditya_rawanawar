    <pattern id='grid' width='40' height='40' patternUnits='userSpaceOnUse'>
      <path d='M 40 0 L 0 0 0 40' fill='none' stroke='#202234' stroke-width='1'/>
    </pattern>
  </defs>
  <rect width='1200' height='750' fill='url(#grid)'/>
  
  <!-- Window Header -->
  <rect x='40' y='40' width='1120' height='50' rx='10' ry='10' fill='#1E2030' stroke='#333752' stroke-width='2'/>
  <circle cx='70' cy='65' r='7' fill='#FF5F56'/>
  <circle cx='95' cy='65' r='7' fill='#FFBD2E'/>
  <circle cx='120' cy='65' r='7' fill='#27C93F'/>
