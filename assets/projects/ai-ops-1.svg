  <text x='85' y='445' font-family='monospace' font-size='13' fill='#C0CAF5'>Vib Sensor:   0.012 g</text>
  <text x='85' y='475' font-family='monospace' font-size='13' fill='#C0CAF5'>TF-IDF Logs:  348 ev/s</text>
  <text x='85' y='505' font-family='monospace' font-size='13' fill='#27C93F'>Mistral-7B:   SYNCED</text>

